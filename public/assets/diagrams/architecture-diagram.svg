<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00DF89" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#00DF89" stop-opacity="0" />
    </radialGradient>

    <!-- Blue Glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3aa9d6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#3aa9d6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181d26" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10141c" stop-opacity="0.98" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#00DF89" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3aa9d6" />
    </marker>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1280" height="820" fill="url(#bgGrad)" />
  <circle cx="240" cy="180" r="340" fill="url(#emeraldGlow)" />
  <circle cx="1060" cy="620" r="380" fill="url(#blueGlow)" />

  <!-- Grid Dots Background Pattern -->
  <g opacity="0.14">
    <pattern id="gridDots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" />
    </pattern>
    <rect width="1280" height="820" fill="url(#gridDots)" />
  </g>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(50, 38)">
    <rect x="0" y="0" width="38" height="38" rx="11" fill="#00DF89" />
    <path d="M 19 11 L 19 27 M 11 19 L 27 19" stroke="#0a0c10" stroke-width="3.5" stroke-linecap="round" />
    <text x="50" y="24" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">Pacho — High-Level System &amp; Software Architecture</text>
    <text x="50" y="43" fill="#8B949E" font-size="13">Feature-Sliced Design (FSD) • Installable PWA • Real-Time Dual Ledger with Supabase</text>
  </g>

  <!-- Top Right Badges -->
  <g transform="translate(930, 42)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#00DF89" fill-opacity="0.12" stroke="#00DF89" stroke-opacity="0.35" />
    <text x="52" y="18" fill="#00DF89" font-size="11" font-weight="700" text-anchor="middle">React 19 + Vite</text>
    <rect x="115" y="0" width="95" height="28" rx="14" fill="#3ECF8E" fill-opacity="0.12" stroke="#3ECF8E" stroke-opacity="0.35" />
    <text x="162" y="18" fill="#3ECF8E" font-size="11" font-weight="700" text-anchor="middle">Supabase</text>
    <rect x="220" y="0" width="75" height="28" rx="14" fill="#3aa9d6" fill-opacity="0.12" stroke="#3aa9d6" stroke-opacity="0.35" />
    <text x="257" y="18" fill="#3aa9d6" font-size="11" font-weight="700" text-anchor="middle">FSD</text>
  </g>

  <!-- ================= TIER 1: CLIENT APPLICATION (PWA) ================= -->
  <g transform="translate(50, 100)">
    <!-- Container Card (Width 700, Height 670) -->
    <rect width="700" height="670" rx="22" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadow)" />
    
    <!-- Top Terminal Bar -->
    <rect width="700" height="48" rx="22" fill="#161b22" />
    <rect y="28" width="700" height="20" fill="#161b22" />
    <circle cx="26" cy="24" r="5" fill="#ff5f56" />
    <circle cx="43" cy="24" r="5" fill="#ffbd2e" />
    <circle cx="60" cy="24" r="5" fill="#27c93f" />
    <text x="82" y="29" fill="#E6EDF3" font-size="14" font-weight="600">Client Layer (Progressive Web Application)</text>
    <text x="585" y="29" fill="#00DF89" font-size="12" font-weight="700">SPA • Cloud Realtime</text>

    <!-- 1. APP LAYER -->
    <g transform="translate(20, 62)">
      <rect width="660" height="74" rx="12" fill="#0d1117" stroke="#238636" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="18" y="24" fill="#3ECF8E" font-size="11" font-weight="700" letter-spacing="0.5">APP LAYER (src/app)</text>
      <text x="18" y="46" fill="#F0F6FC" font-size="13" font-weight="600">Providers, Global Router &amp; CSS System</text>
      <text x="18" y="63" fill="#8B949E" font-size="11">AuthProvider • LocaleCurrencyProvider • ThemeContext • Modular [SEC-XX] Tokens</text>
    </g>

    <!-- 2. PAGES LAYER -->
    <g transform="translate(20, 148)">
      <rect width="660" height="88" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="18" y="23" fill="#58A6FF" font-size="11" font-weight="700" letter-spacing="0.5">PAGES LAYER (src/pages)</text>
      
      <!-- 6 Route Pills with Generous Width -->
      <g transform="translate(16, 36)">
        <rect width="96" height="36" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="48" y="23" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Dashboard</text>

        <rect x="106" width="108" height="36" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="160" y="23" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Transactions</text>

        <rect x="224" width="86" height="36" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="267" y="23" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Goals</text>

        <rect x="320" width="94" height="36" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="367" y="23" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Analytics</text>

        <rect x="424" width="90" height="36" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="469" y="23" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Settings</text>

        <rect x="524" width="102" height="36" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="575" y="23" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Auth &amp; Link</text>
      </g>
    </g>

    <!-- 3. WIDGETS & FEATURES -->
    <g transform="translate(20, 248)">
      <rect width="660" height="106" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="18" y="23" fill="#D29922" font-size="11" font-weight="700" letter-spacing="0.5">WIDGETS &amp; FEATURES (src/widgets &amp; src/features)</text>
      
      <!-- 3 Feature Cards with ample width (204px each) -->
      <g transform="translate(16, 34)">
        <!-- Feature 1 -->
        <rect width="204" height="58" rx="10" fill="#161b22" stroke="#30363d" />
        <text x="14" y="23" fill="#E6EDF3" font-size="12" font-weight="700">Sidebar &amp; Navigation</text>
        <text x="14" y="42" fill="#8B949E" font-size="11">BottomNav, Modals &amp; Header</text>

        <!-- Feature 2 -->
        <rect x="214" width="204" height="58" rx="10" fill="#161b22" stroke="#30363d" />
        <text x="228" y="23" fill="#E6EDF3" font-size="12" font-weight="700">Couple Sync Engine</text>
        <text x="228" y="42" fill="#8B949E" font-size="11">6-char code link &amp; Shared mode</text>

        <!-- Feature 3 -->
        <rect x="428" width="200" height="58" rx="10" fill="#161b22" stroke="#30363d" />
        <text x="442" y="23" fill="#E6EDF3" font-size="12" font-weight="700">Transaction Engine</text>
        <text x="442" y="42" fill="#8B949E" font-size="11">Swipe delete &amp; Fast keypad</text>
      </g>
    </g>

    <!-- 4. ENTITIES & SHARED FOUNDATION -->
    <g transform="translate(20, 366)">
      <rect width="660" height="134" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="18" y="23" fill="#A371F7" font-size="11" font-weight="700" letter-spacing="0.5">ENTITIES &amp; SHARED FOUNDATION (src/entities &amp; src/shared)</text>
      
      <!-- 4 Cards in 2x2 Grid with generous space -->
      <g transform="translate(16, 34)">
        <!-- Card 1 -->
        <rect width="304" height="42" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="12" y="19" fill="#F0F6FC" font-size="12" font-weight="700">Domain Models</text>
        <text x="12" y="33" fill="#8B949E" font-size="10">Accounts, Categories, Goals &amp; Ledger</text>

        <!-- Card 2 -->
        <rect x="316" width="312" height="42" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="328" y="19" fill="#F0F6FC" font-size="12" font-weight="700">Framer Motion UI</text>
        <text x="328" y="33" fill="#8B949E" font-size="10">Liquid Glass 3D, card deck &amp; spring physics</text>

        <!-- Card 3 -->
        <rect y="48" width="304" height="42" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="12" y="67" fill="#F0F6FC" font-size="12" font-weight="700">Safety Guards</text>
        <text x="12" y="81" fill="#8B949E" font-size="10">DoubleConfirmModal &amp; ErrorBoundaries</text>

        <!-- Card 4 -->
        <rect x="316" y="48" width="312" height="42" rx="9" fill="#161b22" stroke="#30363d" />
        <text x="328" y="67" fill="#F0F6FC" font-size="12" font-weight="700">i18n Multi-Language</text>
        <text x="328" y="81" fill="#8B949E" font-size="10">6 Locales (ES, EN, DE, FR, IT, PT)</text>
      </g>
    </g>

    <!-- 5. PWA & CLOUD REALTIME CAPABILITIES -->
    <g transform="translate(20, 512)">
      <rect width="660" height="138" rx="12" fill="#111827" stroke="#1f6feb" stroke-width="1.3" />
      <text x="18" y="24" fill="#58A6FF" font-size="11" font-weight="700" letter-spacing="0.5">PWA &amp; CLOUD REALTIME CAPABILITIES</text>
      
      <!-- Feature Row 1: Manifest -->
      <g transform="translate(18, 38)">
        <circle cx="12" cy="12" r="10" fill="#1f6feb" fill-opacity="0.25" />
        <path d="M 8 12 L 11 15 L 16 9" stroke="#58A6FF" stroke-width="2" fill="none" />
        <text x="30" y="12" fill="#F0F6FC" font-size="12" font-weight="700">Installable PWA Web Manifest</text>
        <text x="30" y="26" fill="#8B949E" font-size="11">iOS Home Screen &amp; Android Chrome standalone display (app-like experience)</text>
      </g>

      <!-- Feature Row 2: Service Worker & Cloud Sync -->
      <g transform="translate(18, 72)">
        <circle cx="12" cy="12" r="10" fill="#00DF89" fill-opacity="0.25" />
        <path d="M 8 12 L 11 15 L 16 9" stroke="#00DF89" stroke-width="2" fill="none" />
        <text x="30" y="12" fill="#F0F6FC" font-size="12" font-weight="700">Service Worker Shell Caching &amp; Supabase Realtime</text>
        <text x="30" y="26" fill="#8B949E" font-size="11">Instant app shell loading with persistent live WebSocket connection</text>
      </g>

      <!-- Feature Row 3: Optimistic UI -->
      <g transform="translate(18, 106)">
        <circle cx="12" cy="12" r="10" fill="#00DF89" fill-opacity="0.25" />
        <path d="M 8 12 L 11 15 L 16 9" stroke="#00DF89" stroke-width="2" fill="none" />
        <text x="30" y="12" fill="#F0F6FC" font-size="12" font-weight="700">Optimistic UI State Mutation</text>
        <text x="30" y="26" fill="#8B949E" font-size="11">Zero-latency transaction input, validated and committed to Supabase</text>
      </g>
    </g>
  </g>

  <!-- ================= TIER 2: VERCEL GLOBAL EDGE ================= -->
  <g transform="translate(790, 100)">
    <rect width="440" height="155" rx="22" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2" filter="url(#shadow)" />
    <rect width="440" height="44" rx="22" fill="#161b22" />
    <rect y="24" width="440" height="20" fill="#161b22" />
    <text x="22" y="28" fill="#FFFFFF" font-size="14" font-weight="700">Vercel Global Edge &amp; CDN</text>

    <g transform="translate(22, 58)">
      <text x="0" y="18" fill="#E6EDF3" font-size="12" font-weight="600">• Production Deployment: <tspan fill="#00DF89">pacho-app.vercel.app</tspan></text>
      <text x="0" y="38" fill="#8B949E" font-size="12">• Automated CI/CD pipeline &amp; branch previews</text>
      <text x="0" y="58" fill="#8B949E" font-size="12">• HTTP/3, Brotli asset compression &amp; TLS termination</text>
      <text x="0" y="78" fill="#8B949E" font-size="12">• SPA rewrite rules for client-side deep linking</text>
    </g>
  </g>

  <!-- ================= TIER 3: SUPABASE BAAS ================= -->
  <g transform="translate(790, 275)">
    <!-- Container Card (Width 440, Height 495) -->
    <rect width="440" height="495" rx="22" fill="url(#cardGrad)" stroke="#238636" stroke-width="1.2" filter="url(#shadow)" />
    
    <!-- Header -->
    <rect width="440" height="48" rx="22" fill="#161b22" />
    <rect y="28" width="440" height="20" fill="#161b22" />
    <text x="22" y="30" fill="#3ECF8E" font-size="15" font-weight="800">Supabase Backend as a Service</text>
    <text x="340" y="30" fill="#8B949E" font-size="12" font-weight="600">PostgreSQL 15</text>

    <!-- 1. Row Level Security (RLS) -->
    <g transform="translate(20, 62)">
      <rect width="400" height="92" rx="11" fill="#0d1117" stroke="#238636" stroke-width="1.2" />
      <text x="16" y="23" fill="#3ECF8E" font-size="12" font-weight="800">ROW LEVEL SECURITY (RLS)</text>
      <text x="16" y="44" fill="#E6EDF3" font-size="12" font-weight="700">Cryptographic Isolation: Personal vs Couple</text>
      <text x="16" y="63" fill="#8B949E" font-size="11">Personal records are strictly private to the user.</text>
      <text x="16" y="78" fill="#8B949E" font-size="11">Shared records accessible only by verified partner_id link.</text>
    </g>

    <!-- 2. Realtime Postgres Replication -->
    <g transform="translate(20, 166)">
      <rect width="400" height="88" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="16" y="23" fill="#58A6FF" font-size="12" font-weight="800">REALTIME POSTGRES REPLICATION</text>
      <text x="16" y="44" fill="#E6EDF3" font-size="12" font-weight="700">Live WebSocket Broadcasts (&lt;100ms)</text>
      <text x="16" y="63" fill="#8B949E" font-size="11">When a partner logs a shared expense, the other device</text>
      <text x="16" y="78" fill="#8B949E" font-size="11">updates automatically without refreshing.</text>
    </g>

    <!-- 3. Relational Schema -->
    <g transform="translate(20, 266)">
      <rect width="400" height="116" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="16" y="23" fill="#D29922" font-size="12" font-weight="800">RELATIONAL DATA SCHEMA</text>
      <g transform="translate(16, 36)">
        <text x="0" y="14" fill="#8B949E" font-size="11">├── <tspan fill="#F0F6FC" font-weight="700">profiles</tspan> (couple code, preferences, locale)</text>
        <text x="0" y="32" fill="#8B949E" font-size="11">├── <tspan fill="#F0F6FC" font-weight="700">accounts</tspan> (bank, cash, card, is_shared flag)</text>
        <text x="0" y="50" fill="#8B949E" font-size="11">├── <tspan fill="#F0F6FC" font-weight="700">transactions</tspan> (amount, category_id, payer_id)</text>
        <text x="0" y="68" fill="#8B949E" font-size="11">└── <tspan fill="#F0F6FC" font-weight="700">goals &amp; budgets</tspan> (target, current, deadlines)</text>
      </g>
    </g>

    <!-- 4. Auth & Storage -->
    <g transform="translate(20, 394)">
      <rect width="400" height="82" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="16" y="22" fill="#A371F7" font-size="12" font-weight="800">AUTHENTICATION &amp; STORAGE</text>
      <text x="16" y="43" fill="#E6EDF3" font-size="12" font-weight="700">Supabase Auth (JWT &amp; Refresh Tokens)</text>
      <text x="16" y="62" fill="#8B949E" font-size="11">Persistent session management with OAuth &amp; Magic Links.</text>
    </g>
  </g>

  <!-- ================= DATA FLOW CONNECTORS ================= -->
  <!-- Line 1: Client to Vercel CDN -->
  <path d="M 750 178 L 790 178" stroke="#3aa9d6" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrowBlue)" />

  <!-- Line 2: Client to Supabase RLS / REST -->
  <path d="M 750 395 L 790 395" stroke="#00DF89" stroke-width="2.2" marker-end="url(#arrowEmerald)" />

  <!-- Line 3: Supabase Realtime to Client -->
  <path d="M 790 475 L 750 475" stroke="#58A6FF" stroke-width="2.2" marker-end="url(#arrowBlue)" />

  <!-- Connector Badges -->
  <rect x="755" y="377" width="30" height="16" rx="4" fill="#0d1117" stroke="#00DF89" stroke-width="0.8" />
  <text x="770" y="389" fill="#00DF89" font-size="8" font-weight="800" text-anchor="middle">HTTP</text>

  <rect x="755" y="482" width="30" height="16" rx="4" fill="#0d1117" stroke="#58A6FF" stroke-width="0.8" />
  <text x="770" y="494" fill="#58A6FF" font-size="8" font-weight="800" text-anchor="middle">WSS</text>

  <!-- ================= FOOTER AUDIT BAR ================= -->
  <g transform="translate(50, 792)">
    <text x="0" y="14" fill="#8B949E" font-size="11">Clean Architecture • Strict Types • Automated Audit (`npm run audit`) • Zero Orphaned Locales</text>
    <text x="1180" y="14" fill="#00DF89" font-size="12" font-weight="700" text-anchor="end">Pacho © 2026</text>
  </g>
</svg>
